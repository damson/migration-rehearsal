name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test the probe's decisions against a scripted fake driver
        run: npm run test

      # The reference workflows are full of placeholders, so nothing else here
      # ever parses them. Without this, a broken one would be found by the first
      # person trying to adopt it.
      - name: Reference workflows parse, and their placeholders are documented
        run: npm run check:placeholders

  links:
    name: the README and the article agree with the files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # A README promising a file that is not there is the first thing a visitor
      # discovers, and the last thing the author notices.
      - name: Every repository-relative link resolves
        run: |
          set -euo pipefail
          missing=0
          for doc in README.md CONTRIBUTING.md SECURITY.md docs/*.md; do
            targets=$(grep -oE '\]\([^)#][^)]*\)' "$doc" | sed -E 's/^\]\(//; s/\)$//' || true)
            for t in $targets; do
              case "$t" in
                http*|mailto:*) continue ;;
              esac
              path="${t%%#*}"
              [ -z "$path" ] && continue
              base=$(dirname "$doc")
              if [ ! -e "$base/$path" ] && [ ! -e "$path" ]; then
                echo "::error file=$doc::links to $path, which does not exist"
                missing=$((missing+1))
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "$missing broken link(s)."
            exit 1
          fi
          echo "All repository-relative links resolve."
