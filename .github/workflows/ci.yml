name: CI

on:
  push:
    # Both long-lived branches. `develop` is where work integrates and where
    # pull requests are based; `main` carries releases. Measuring only one of
    # them leaves the other's history unverified, and a base branch nobody
    # measures is a base nobody can compare a pull request against.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test the rehearsal's decisions against a scripted fake driver
        run: npm run test

      # The reference workflows are full of placeholders, so nothing else here
      # ever parses them. Without this, a broken one would be found by the first
      # person trying to adopt it.
      - name: Reference workflows parse, and their placeholders are documented
        run: npm run check:placeholders

  links:
    name: the README and the article agree with the files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # A README promising a file that is not there is the first thing a visitor
      # discovers, and the last thing the author notices.
      - name: Every repository-relative link resolves
        run: |
          set -euo pipefail
          missing=0
          for doc in README.md CONTRIBUTING.md SECURITY.md docs/*.md; do
            targets=$(grep -oE '\]\([^)#][^)]*\)' "$doc" | sed -E 's/^\]\(//; s/\)$//' || true)
            for t in $targets; do
              case "$t" in
                http*|mailto:*) continue ;;
              esac
              path="${t%%#*}"
              [ -z "$path" ] && continue
              base=$(dirname "$doc")
              if [ ! -e "$base/$path" ] && [ ! -e "$path" ]; then
                echo "::error file=$doc::links to $path, which does not exist"
                missing=$((missing+1))
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "$missing broken link(s)."
            exit 1
          fi
          echo "All repository-relative links resolve."

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The article's primer is written so nothing later assumes prior
      # knowledge, and its author cannot judge whether that worked: re-reading
      # your own explanation tells you it is correct, never that it is
      # followable. This measures the parts that are measurable and names the
      # sentences a reader is most likely to stop at.
      - name: The article stays readable
        run: node tools/readability.mjs

      # And the check is watched refusing, because a threshold that has only
      # ever passed is indistinguishable from one that cannot fail. The fixture
      # breaks three thresholds and omits the primer.
      - name: The readability check can fail
        run: |
          set -euo pipefail
          set +e
          node tools/readability.mjs tools/fixtures/hard-to-read.md > hard.log 2>&1
          code=$?
          set -e
          cat hard.log
          if [ $code -eq 0 ]; then
            echo '::error::The readability check passed a document written to break it.'
            exit 1
          fi
          grep -q 'Flesch-Kincaid grade' hard.log
          grep -q 'the primer section was not found' hard.log
          echo "OK  refused, with $(grep -c '::error::' hard.log) finding(s)."
