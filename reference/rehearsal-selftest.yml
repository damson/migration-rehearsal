name: Rehearsal self-test

# Proves the rehearsal's guards can fail, against a throwaway Postgres that costs
# nothing to break.
#
# A gate nobody has watched refuse is decoration. Every check here comes in a
# pair: a must-pass step and a must-fail step, because a guard hard-wired to
# refuse everything satisfies the negatives perfectly and a guard hard-wired to
# accept everything satisfies the positives.
#
# Two of the assertions come from the database rather than from the tool, and
# they are the ones that matter: the table a rolled-back migration created must
# be gone, and the table that escaped the rollback must still be there. Without
# the second, an alarm that fired on every run would pass this job.
#
# PLACEHOLDERS, as in rehearse-migrations.yml:
#
#   <MIGRATIONS_DIR>   where migrations live
#   <REHEARSAL_DIR>        where rehearsal.ts and run-rehearsal.ts live
#   <PRELUDE_SQL>      optional: SQL creating whatever roles and schemas your
#                      migrations assume a managed provider supplies. Delete the
#                      step if your migrations only touch `public`.
#   <NODE_VERSION>     e.g. '20'
#
# The future versions below (2099...) sort after every real migration, so they
# are applied last, and each step deletes its own file on the way out.

on:
  pull_request:
    paths:
      - '<MIGRATIONS_DIR>/**.sql'
      - '<REHEARSAL_DIR>/**'
      - '.github/workflows/rehearsal-selftest.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    name: probe guards and rollback, on throwaway Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: rehearsal_selftest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: testpw
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: rehearsal_selftest
      REHEARSAL_MIGRATIONS_DIR: <MIGRATIONS_DIR>
      # The override is accepted only against a loopback host. One of the steps
      # below proves it refuses everything else rather than quietly ignoring the
      # mismatch.
      REHEARSAL_TARGET_DB_URL: postgresql://postgres:testpw@localhost:5432/rehearsal_selftest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '<NODE_VERSION>'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Bootstrap the roles and schemas a managed provider supplies
        run: psql -v ON_ERROR_STOP=1 -f <PRELUDE_SQL>

      - name: Bring the schema and the ledger up to date
        run: |
          set -euo pipefail
          for m in $(ls <MIGRATIONS_DIR>/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -f "$m" >/dev/null
          done
          # Hand-written, which is forbidden anywhere the real migration tool
          # will later touch this table: the real one carries columns a guess
          # will miss, and the tool's own insert then fails in a way that reads
          # like a migration bug. It is safe HERE because no step in this job
          # runs the tool. The rehearsal only ever reads `version` from it.
          psql -v ON_ERROR_STOP=1 -c 'create schema supabase_migrations'
          psql -v ON_ERROR_STOP=1 -c 'create table supabase_migrations.schema_migrations (version text primary key)'
          n=0
          for m in <MIGRATIONS_DIR>/*.sql; do
            v=$(basename "$m" | cut -d_ -f1)
            psql -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations (version) values ('$v')" >/dev/null
            n=$((n+1))
          done
          if [ "$n" -eq 0 ]; then
            echo '::error::No migrations were seeded, so every check below would pass vacuously.'
            exit 1
          fi
          echo "Seeded $n ledger versions."
          # A table with a row in it, so the data-shape step below has something
          # to violate. A NOT NULL over an EMPTY table passes for the same
          # uninteresting reason the correct version does.
          psql -v ON_ERROR_STOP=1 -c 'create table rehearsal_target (id int)'
          psql -v ON_ERROR_STOP=1 -c 'insert into rehearsal_target (id) values (1)'

      # ---- the must-pass half -------------------------------------------------

      # `set +e` around the call and `cat` before the verdict, in the must-PASS
      # steps too. With the redirect inside `set -e`, a non-zero exit aborts the
      # step before the log is printed, so the one thing that would say WHY is
      # thrown away.
      - name: Passes, and says nothing was checked, when the ledger is current
        run: |
          set -euo pipefail
          set +e
          npx tsx <REHEARSAL_DIR>/run-rehearsal.ts --allow-loopback-target > current.log 2>&1
          code=$?
          set -e
          cat current.log
          if [ $code -ne 0 ]; then
            echo '::error::The rehearsal failed against a current ledger, where it should have had nothing to do.'
            exit 1
          fi
          grep -q 'Nothing was applied and nothing was checked' current.log

      - name: Applies a pending migration, rolls it back, and leaves nothing behind
        run: |
          set -euo pipefail
          trap 'rm -f <MIGRATIONS_DIR>/2099*.sql' EXIT
          echo 'create table rehearsal_ok (id int);' > <MIGRATIONS_DIR>/2099010100000100_rehearsal_ok.sql
          set +e
          npx tsx <REHEARSAL_DIR>/run-rehearsal.ts --allow-loopback-target > ok.log 2>&1
          code=$?
          set -e
          cat ok.log
          if [ $code -ne 0 ]; then
            echo '::error::The rehearsal refused a clean pending migration.'
            exit 1
          fi
          grep -q '2099010100000100_rehearsal_ok.sql' ok.log
          grep -q 'nothing was written' ok.log
          # The assertion that makes the rest mean anything: the table the
          # migration created must NOT be here. Everything above is the rehearsal
          # describing itself; this is the database answering.
          left=$(psql -tAX -c "select count(*) from pg_class where relname = 'rehearsal_ok'")
          if [ "$left" != "0" ]; then
            echo "::error::rehearsal_ok survived the rollback ($left). The rehearsal WROTE to its target."
            exit 1
          fi
          echo "Applied and rolled back, nothing left. OK"

      # ---- the must-fail half -------------------------------------------------

      - name: Must refuse a migration real rows cannot accommodate
        run: |
          set -euo pipefail
          trap 'rm -f <MIGRATIONS_DIR>/2099*.sql' EXIT
          # The failure class this whole pattern exists for: valid SQL, applies
          # to an empty database, cannot apply where rows already live.
          echo 'alter table rehearsal_target add column rehearsal_nn text not null;' \
            > <MIGRATIONS_DIR>/2099010100000200_rehearsal_notnull.sql
          set +e
          npx tsx <REHEARSAL_DIR>/run-rehearsal.ts --allow-loopback-target > notnull.log 2>&1
          code=$?
          set -e
          cat notnull.log
          if [ $code -eq 0 ]; then
            echo '::error::The rehearsal passed a NOT NULL over existing rows. The gate did not fire.'
            exit 1
          fi
          if ! grep -q '23502' notnull.log; then
            echo '::error::Refused, but not with 23502. Wrong failure, so this proves nothing.'
            exit 1
          fi
          grep -q 'DATA-SHAPE' notnull.log
          echo "Refused with 23502 and named the class. OK"

      - name: Must refuse transaction control before it dials
        run: |
          set -euo pipefail
          trap 'rm -f <MIGRATIONS_DIR>/2099*.sql' EXIT
          printf 'create table rehearsal_tc (id int);\ncommit;\n' \
            > <MIGRATIONS_DIR>/2099010100000300_rehearsal_commit.sql
          set +e
          npx tsx <REHEARSAL_DIR>/run-rehearsal.ts --allow-loopback-target > tc.log 2>&1
          code=$?
          set -e
          cat tc.log
          if [ $code -eq 0 ]; then
            echo '::error::A migration carrying `commit` was accepted.'
            exit 1
          fi
          grep -q 'transaction control' tc.log
          grep -q 'not run: the target or the migrations were refused' tc.log
          echo "Refused before dialling. OK"

      # The guard the text check CANNOT provide. Bare `end;` commits, and
      # banning the word `end` would reject every `end if` in every guarded
      # migration, so this is the case that proves the savepoint is load-bearing
      # rather than ceremonial.
      - name: Must detect an escape the text guard cannot see
        run: |
          set -euo pipefail
          trap 'rm -f <MIGRATIONS_DIR>/2099*.sql' EXIT
          printf 'create table rehearsal_escape (id int);\nend;\ncreate table rehearsal_after (id int);\n' \
            > <MIGRATIONS_DIR>/2099010100000400_rehearsal_end.sql
          set +e
          npx tsx <REHEARSAL_DIR>/run-rehearsal.ts --allow-loopback-target > escape.log 2>&1
          code=$?
          set -e
          cat escape.log
          if [ $code -eq 0 ]; then
            echo '::error::A migration that committed mid-rehearsal was reported as clean.'
            exit 1
          fi
          grep -q "SAVEPOINT WAS DESTROYED" escape.log
          # And the escape was REAL, not a false alarm: the table is still here.
          # Without this, an alarm that fires on every run would pass.
          survived=$(psql -tAX -c "select count(*) from pg_class where relname = 'rehearsal_escape'")
          if [ "$survived" != "1" ]; then
            echo "::error::The alarm fired but nothing actually committed ($survived). It is firing for the wrong reason."
            exit 1
          fi
          echo "Escape detected, and it was a real one. OK"
          psql -v ON_ERROR_STOP=1 -c 'drop table if exists rehearsal_escape'

      - name: Must refuse the loopback override against a real host
        env:
          REHEARSAL_TARGET_DB_URL: postgresql://postgres.abcdefghijklmnop:pw@aws-0-eu-west-2.pooler.example.com:5432/postgres
        run: |
          set -euo pipefail
          set +e
          npx tsx <REHEARSAL_DIR>/run-rehearsal.ts --allow-loopback-target > host.log 2>&1
          code=$?
          set -e
          cat host.log
          if [ $code -eq 0 ]; then
            echo '::error::The loopback override was accepted against a pooler host.'
            exit 1
          fi
          grep -q 'only accepted against a loopback host' host.log
          echo "Refused. OK"

      - name: Must refuse a loopback target when the override is NOT given
        run: |
          set -euo pipefail
          set +e
          REHEARSAL_EXPECTED_PROJECT_REF=xxxxxxxxxxxxxxxxxxxx \
            npx tsx <REHEARSAL_DIR>/run-rehearsal.ts > noflag.log 2>&1
          code=$?
          set -e
          cat noflag.log
          if [ $code -eq 0 ]; then
            echo '::error::The rehearsal ran against an unverified target with no override. The default is not fail-closed.'
            exit 1
          fi
          echo "Refused without the override. OK"
